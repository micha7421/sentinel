[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.6.0"
description = "Background security guard for Linux: ransomware and break-in protection"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["psutil", "watchdog"]

[project.optional-dependencies]
gui = ["PyQt6"]
dev = ["pytest", "pyflakes"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
