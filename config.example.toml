# Sentinel settings. After changing: restart Sentinel
#   systemd: sudo systemctl restart sentinel    OpenRC: sudo rc-service sentinel restart
# (Or change them in the Sentinel window, which does this for you.)

# Your username (gets the popups, ~ means this user's home folder).
# Empty = find it automatically (works if the PC has one user account).
user = ""

# ---------- Ransomware guard ----------

# Folders to protect from ransomware
watch_dirs = ["~/Documents", "~/Pictures", "~/Desktop", "~/Downloads", "~/Music", "~/Videos"]

# Put trap files ("!sentinel-trap-do-not-touch.docx") into those folders
canaries = true

# Alarm when this many files change within this many seconds (and look encrypted)
burst_files = 30
window_seconds = 10

# What to do with the ransomware: kill it, and move it to quarantine
auto_kill = true
auto_quarantine = true

# Programs that are never killed
allowlist = ["dolphin", "plasmashell", "baloo_file", "kio_file", "kioworker",
             "rsync", "borg", "restic", "git", "tar", "ark", "kdeconnectd",
             "syncthing", "nextcloud"]

# ---------- Break-in guard ----------

breakin_guard = true

# Block attackers in the firewall (nftables), and for how many hours
auto_block = true
block_hours = 24

# SSH attack: this many failed logins within this many minutes
ssh_max_failures = 5
ssh_window_minutes = 10

# Port scan: this many different ports within this many seconds
scan_ports = 15
scan_window_seconds = 20

# Look up location, provider and owner of attackers online (ipinfo.io, rdap.org)
ip_lookup = true

# Addresses that are never blocked, e.g. "192.168.1.10" or "192.168.1.0/24"
trusted_ips = ["127.0.0.0/8", "::1/128"]

# ---------- Gentoo ----------

# Check system programs against Portage's records once a day
system_check = true

# ---------- Spyware & sabotage guard ----------

# Warn when a program reads your secrets (/etc/shadow, SSH keys, WiFi passwords)
credential_guard = true
credential_bait = true            # plant decoy password files as bait
credential_auto_kill = true       # stop a program that opens a decoy file
credential_auto_quarantine = true
credential_readers = []           # extra program names allowed to read secrets

# Warn when something adds itself to autostart, cron or a login script
persistence_guard = true

# Catch fork bombs (process explosions). Off by default: compiling on Gentoo
# starts many processes and could look like one. Raise the limit if you turn it on.
crash_guard = false
crash_max_children = 200

# ---------- Supply-chain guard (Arch/pacman) ----------

# Scan packages for risky install scripts / SUID / sensitive files before
# pacman installs them (needs the pacman hook; installed automatically on Arch)
package_scan = true
# Refuse to install a package with a HIGH-risk finding (otherwise only warn)
package_scan_block = false
